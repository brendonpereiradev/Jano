<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 128" role="img" aria-labelledby="t">
  <title id="t">Jano, visitas preventivas</title>
  <style>
    /*
      Ciclo de 8 s, repetido: o portal se ergue, cada pavimento abre (azul) e fecha (menta) de baixo para cima,
      o nome entra, a cena fica parada uns 4 s e some antes de recomeçar. Repete porque, num README, a primeira
      passagem costuma acontecer antes de a imagem aparecer na tela.
    */
    .scene, .draw, .key, .pair, .name, .tag { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
    .scene { animation-name: scene; }
    .draw { stroke-dasharray: 1; }
    .sill { animation-name: sill; }
    .arch { animation-name: arch; }
    .key { animation-name: key; }
    .pair { transform-box: fill-box; transform-origin: left center; }
    .o1 { animation-name: o1; } .c1 { animation-name: c1; }
    .o2 { animation-name: o2; } .c2 { animation-name: c2; }
    .o3 { animation-name: o3; } .c3 { animation-name: c3; }
    .name { animation-name: name; }
    .tag { animation-name: tag; }
    @keyframes scene { 0%, 88% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes sill { 0% { stroke-dashoffset: 1; } 4%, 100% { stroke-dashoffset: 0; } }
    @keyframes arch { 0%, 3% { stroke-dashoffset: 1; } 11%, 100% { stroke-dashoffset: 0; } }
    @keyframes key { 0%, 11% { opacity: 0; } 14%, 100% { opacity: 1; } }
    @keyframes o1 { 0%, 14% { transform: scaleX(0); } 16.5%, 100% { transform: scaleX(1); } }
    @keyframes c1 { 0%, 16% { transform: scaleX(0); } 18.5%, 100% { transform: scaleX(1); } }
    @keyframes o2 { 0%, 18% { transform: scaleX(0); } 20.5%, 100% { transform: scaleX(1); } }
    @keyframes c2 { 0%, 20% { transform: scaleX(0); } 22.5%, 100% { transform: scaleX(1); } }
    @keyframes o3 { 0%, 22% { transform: scaleX(0); } 24.5%, 100% { transform: scaleX(1); } }
    @keyframes c3 { 0%, 24% { transform: scaleX(0); } 26.5%, 100% { transform: scaleX(1); } }
    @keyframes name { 0%, 26% { opacity: 0; transform: translateX(-8px); } 33%, 100% { opacity: 1; transform: none; } }
    @keyframes tag { 0%, 29% { opacity: 0; transform: translateX(-8px); } 36%, 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .scene, .draw, .key, .pair, .name, .tag { animation: none; }
    }
  </style>
  <rect width="460" height="128" fill="#101318"/>
  <defs>
    <linearGradient id="jn-tile" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
  </defs>
  <!-- Emblema: o ladrilho fica sempre; o resto entra e sai a cada ciclo -->
  <rect width="128" height="128" rx="28" fill="url(#jn-tile)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#4c8df6" stroke-opacity="0.4" stroke-width="3"/>
  <g class="scene">
    <path class="draw sill" pathLength="1" d="M28 108 H100" stroke="#98a2b0" stroke-width="5" stroke-linecap="round"/>
    <path class="draw arch" pathLength="1" d="M38 100 V60 A26 26 0 0 1 90 60 V100" fill="none" stroke="#e6e9ee" stroke-width="7" stroke-linecap="round"/>
    <circle class="key" cx="64" cy="46" r="4" fill="#e6e9ee"/>
    <path class="pair o1" d="M50 88 H58" stroke="#4c8df6" stroke-width="6" stroke-linecap="round"/>
    <path class="pair c1" d="M70 88 H78" stroke="#7fd1be" stroke-width="6" stroke-linecap="round"/>
    <path class="pair o2" d="M50 74 H58" stroke="#4c8df6" stroke-width="6" stroke-linecap="round"/>
    <path class="pair c2" d="M70 74 H78" stroke="#7fd1be" stroke-width="6" stroke-linecap="round"/>
    <path class="pair o3" d="M50 60 H58" stroke="#4c8df6" stroke-width="6" stroke-linecap="round"/>
    <path class="pair c3" d="M70 60 H78" stroke="#7fd1be" stroke-width="6" stroke-linecap="round"/>
    <!-- Nome -->
    <text class="name" x="156" y="74" font-family="Bahnschrift, 'Barlow Semi Condensed', 'Segoe UI', sans-serif" font-size="58" font-weight="600" letter-spacing="18" fill="#e6e9ee">JANO</text>
    <text class="tag" x="158" y="103" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace" font-size="15" letter-spacing="5.4" fill="#8db5fa">VISITAS PREVENTIVAS</text>
  </g>
</svg>
